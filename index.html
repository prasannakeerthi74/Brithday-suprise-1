<!DOCTYPE html>
<html>
<head>
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎂 Happy Birthday, Sarah! 🎂</h1>

        <p class="subtitle">
            Today is all about you! 💗
        </p>

        <button onclick="showSurprise()">
            🎁 Click for Your Surprise
        </button>

        <div id="surprise">
            <h2>💖 You are Special! 💖</h2>

            <p>
                Wishing you lots of happiness, love and beautiful
                memories. May all your dreams come true! ✨
            </p>

            <div class="photos">
                <img src="photo1.jpg">
                <img src="photo2.jpg">
                <img src="photo3.jpg">
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
